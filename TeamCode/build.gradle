// Team 8103 overlay for an official FIRST-Tech-Challenge/FtcRobotController checkout.
// Keep the SDK-owned root Gradle files and FtcRobotController module from that checkout.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url = 'https://repo.dairy.foundation/releases' }
    }
    dependencies {
        classpath 'dev.frozenmilk:Load:0.3.2'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

// push.sh / push.ps1 own the connection and select exactly one robot.
load {
    autoconnect = dev.frozenmilk.sinister.sloth.AutoConnect.valueOf('NEVER')
}

apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    mavenCentral()
    google()
    maven { url = 'https://repo.dairy.foundation/releases' }
    maven { url = 'https://mymaven.bylazar.com/releases' }
    maven { url = 'https://maven.brott.dev/' }
}

// Sloth's Dashboard and Panels variants provide the original library packages.
// Exclude the originals to keep one implementation of those classes in the APK.
configurations.configureEach {
    exclude group: 'com.acmerobotics.dashboard'
    exclude group: 'com.bylazar'
    // Dashboard 0.6 owns Limelight ports 5800/5801/5805/5807. Panels' duplicate
    // proxy binds the same ports during startup and crashes the Robot Controller.
    exclude group: 'com.bylazar.sloth', module: 'limelightproxy'
}

dependencies {
    implementation project(':FtcRobotController')

    implementation 'dev.frozenmilk.sinister:Sloth:0.3.2'
    implementation 'com.acmerobotics.slothboard:dashboard:0.3.2+0.6.0'
    implementation 'com.bylazar.sloth:fullpanels:0.3.2+1.0.13'
    implementation 'com.pedropathing:revhub:3.0.1'
    implementation 'com.pedropathing:tuning:1.0.1'
    implementation 'com.pedropathing.ivy:core:1.1.1'
    implementation 'com.pedropathing.ivy:pedro:1.1.1'
    implementation 'org.ftclib.ftclib:core:2.1.1'

    testImplementation 'junit:junit:4.13.2'
    // Preserve the existing subclass mock behavior when updating Mockito 5.
    testImplementation 'org.mockito:mockito-subclass:5.23.0'
    testImplementation 'org.json:json:20260814'
}

// Keep Load 0.3.2's tasks and rotating reload files, with explicit ADB targeting.
// Its stock actions allow implicit device selection and check "lock" although
// the runtime creates "sloth.lock". All commands below require ANDROID_SERIAL.
abstract class SlothExecServices {
    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()
}

def slothExec = objects.newInstance(SlothExecServices)
def runSlothAdb = { task, arguments ->
    def serial = System.getenv('ANDROID_SERIAL')
    if (!serial) {
        throw new GradleException('ANDROID_SERIAL is required. Use push.sh or push.ps1 to select the robot.')
    }
    def stderr = new ByteArrayOutputStream()
    def stdout = new ByteArrayOutputStream()
    def result = slothExec.execOperations.exec { spec ->
        spec.commandLine(([task.adbExecutable.get().asFile.absolutePath, '-s', serial] + arguments)
                .collect { it.toString() })
        spec.ignoreExitValue = true
        spec.errorOutput = stderr
        spec.standardOutput = stdout
    }
    [result.exitValue, stderr.toString('UTF-8'), stdout.toString('UTF-8')]
}

tasks.named('deploySloth').configure {
    setActions([])
    doLast { task ->
        def location = task.deployLocation.get()
        def checkLock = {
            def result = runSlothAdb(task, ['shell', "test ! -f ${location}/sloth.lock"])
            if (result[1].trim()) {
                throw new GradleException(result[1])
            }
            result[0] == 0
        }
        if (!checkLock()) {
            throw new GradleException('Sloth is still loading (lock file exists). Wait for the previous load or restart the robot.')
        }
        def bundle = task.outputDir.file("${task.bundleBaseName.get()}.jar").get().asFile.absolutePath
        def pushed = runSlothAdb(task, ['push', bundle, "${location}/${System.nanoTime()}.jar"])
        if (pushed[0] != 0) {
            throw new GradleException("Sloth push failed (exit ${pushed[0]}): ${pushed[1]}")
        }
        while (!checkLock()) {
            Thread.sleep(50)
        }
    }
}

tasks.named('removeSlothRemote').configure {
    setActions([])
    doLast { task ->
        def location = task.deployLocation.get()
        def quote = { value -> "'" + value.replace("'", "'\\''") + "'" }
        def directory = quote(location)
        def listing = runSlothAdb(task, ['shell', "if [ -d ${directory} ]; then ls -1 ${directory}; fi"])
        if (listing[0] != 0) {
            throw new GradleException("Sloth reload listing failed (exit ${listing[0]}): ${listing[1]}")
        }
        // Only Sloth's rotating and legacy reload files belong to this cleanup.
        def reloads = listing[2].readLines().findAll { name ->
            name in ['loaded.jar', 'to_load.jar', 'sloth.lock'] || name ==~ /-?\d+\.jar/
        }
        if (reloads.isEmpty()) return
        def paths = reloads.collect { name -> quote("${location}/${name}") }.join(' ')
        def result = runSlothAdb(task, ['shell', "rm -f ${paths}"])
        if (result[0] != 0) {
            throw new GradleException("Sloth cleanup failed (exit ${result[0]}): ${result[1]}")
        }
    }
}
